name: Analytical checks
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: housing
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: ci-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U housing -d housing"
          --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - run: python pipeline.py --refresh --dsn 'postgresql://housing:ci-local-only@localhost:5432/housing'
      - run: python -m unittest discover -s tests -v
